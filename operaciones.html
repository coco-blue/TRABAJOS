<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="diseñoT.css">
    <link rel="icon" type="imagen/png" href="icono.png">
</head>
<body class="contenido">
    <h1>operacion basica</h1>
    <script>
        let N1=Number(prompt("introduce el primer numero"));
        let N2=Number(prompt("introduce el segundo numero"));
        suma=N1+N2;
        document.write("el valor de la suma es: "+suma+"<br>");
        resta=N1-N2;
        document.write("el valor de la resta es: "+resta+"<br>");
        munti=N1*N2;
        document.write("el valor de la multiplicacion es: "+munti+"<br>");
        divicion=N1/N2;
        document.write("el valor de la divicion es: "+divicion+"<br>");
    </script>
</body>
</html>
